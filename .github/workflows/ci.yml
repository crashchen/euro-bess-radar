name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Lint with ruff
        run: ruff check src/ app.py tests/

      - name: Verify syntax
        run: |
          python -m py_compile app.py
          find src/ tests/ -name '*.py' -exec python -m py_compile {} +

      - name: Run test suite with coverage
        run: pytest --cov=src --cov-report=term-missing -q

  minimum-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimum supported Streamlit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt streamlit==1.55.0

      - name: Exercise real panels on the minimum UI runtime
        run: |
          python -m pytest tests/test_step2_views.py tests/test_ui_theme.py tests/test_market_grid_guards.py -k "panel or chart or caption or cockpit" -q
