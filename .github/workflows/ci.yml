name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Lint with ruff
        run: ruff check src/ app.py tests/

      - name: Verify syntax
        run: |
          python -m py_compile app.py
          find src/ tests/ -name '*.py' -exec python -m py_compile {} +

      - name: Run test suite with coverage
        run: pytest --cov=src --cov-report=term-missing -q

  # Pins only the two runtime versions named in the job title. Every other
  # dependency still resolves from the manifest ranges, so this is not a
  # minimum-version test of the whole dependency set.
  compat-py311-streamlit1550:
    name: Python 3.11 / Streamlit 1.55.0 compatibility check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements with Streamlit pinned to 1.55.0
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt streamlit==1.55.0

      - name: Exercise real panels on Python 3.11 with Streamlit 1.55.0
        run: |
          python -m pytest tests/test_step2_views.py tests/test_ui_theme.py tests/test_market_grid_guards.py -k "panel or chart or caption or cockpit" -q
